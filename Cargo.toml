[package]
name = "glibc-run"
version = "0.1.3"
edition = "2021"
description = "Uruchamia binarki glibc na systemie musl — jak wine, ale nosi prawdziwe glibc"
license = "MIT"

[[bin]]
name = "glibc-run"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
strip = true
panic = "abort"
